name: Monthly data update

on:
  schedule:
    # 5th of every month, 02:17 UTC (10:17 Ulaanbaatar)
    - cron: "17 2 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch UN Comtrade data
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: python scripts/fetch_comtrade.py
      - name: Run mirror analysis
        run: python scripts/analyze.py
      - name: Commit changes
        run: |
          git config user.name "resource-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Monthly data update $(date -u +%Y-%m-%d)"
          git push
